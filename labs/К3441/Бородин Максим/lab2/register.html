<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><script defer src="api.js"></script><script defer src="app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>
<header class="site-header"><div class="container nav-wrap">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✳</span>Вкусно вместе</a>
  <nav class="site-nav" aria-label="Основная навигация"><div class="nav-links"><a class="nav-link" href="index.html">Рецепты</a><a class="nav-link" href="recipe.html?id=1">Рецепт дня</a><a class="nav-link" href="profile.html"><svg class="icon" aria-hidden="true"><use href="assets/sprite.svg#user"></use></svg>Мой профиль</a></div>
  <div class="nav-actions"><button class="btn btn-outline-primary btn-sm" id="theme-button" type="button" aria-label="Включить тёмную тему"><svg class="icon" aria-hidden="true"><use href="assets/sprite.svg#moon"></use></svg><span>Тема</span></button><a class="nav-link" href="login.html">Войти</a><a class="btn btn-primary btn-sm" href="register.html">Регистрация</a></div></nav>
</div></header>
<main id="main"><div class="auth-shell"><section class="auth-card" aria-labelledby="register-title"><span class="eyebrow">Присоединяйтесь</span><h1 id="register-title">Создать профиль</h1><p>Соберите любимые блюда в одном месте.</p><form id="register-form"><div class="mb-3"><label class="form-label" for="register-name">Имя</label><input class="form-control" id="register-name" autocomplete="name" required minlength="2"></div><div class="mb-3"><label class="form-label" for="register-email">Электронная почта</label><input class="form-control" id="register-email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="register-password">Пароль</label><input class="form-control" id="register-password" type="password" autocomplete="new-password" minlength="6" required><div class="form-text">Не менее 6 символов.</div></div><div class="mb-3"><label class="form-label" for="register-confirm">Повторите пароль</label><input class="form-control" id="register-confirm" type="password" autocomplete="new-password" required></div><p class="text-danger" id="auth-error" role="alert" tabindex="-1" hidden></p><button class="btn btn-primary w-100" type="submit">Зарегистрироваться</button></form><p class="mt-4 mb-0">Уже есть аккаунт? <a href="login.html">Войдите</a></p></section></div></main>
<footer class="site-footer"><div class="container"><span>© 2026 Вкусно вместе</span><span>Учебный проект · Бородин Максим, К3441</span></div></footer>
